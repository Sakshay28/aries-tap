# Disposable Postgres + a Neon-HTTP proxy for exercising the acceptance suite
# against real SQL on your machine. This mirrors the `postgres-acceptance` job in
# .github/workflows/ci.yml exactly, so a green run here is the same green run CI
# gets. Everything is throwaway — `docker compose -f docker-compose.test.yml
# down -v` removes the volume too. Never point this at a real database.
#
# The @neondatabase/serverless driver speaks Neon's HTTP protocol, not raw TCP
# Postgres, so the proxy sits in front of the throwaway Postgres and the driver
# talks to it over http://localhost:4444/sql (see tests/acceptance.test.ts).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      # Reaches the db by its compose service name on the shared network.
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
